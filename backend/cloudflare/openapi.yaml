openapi: 3.1.0
info:
  title: TestHelper AI
  version: 0.4.0-preparation
  description: Shared Android/iOS contract; Firebase rollout pending owner provisioning.
servers:
  - url: https://testhelper-ai.zhantik690.workers.dev
security:
  - firebase: []
paths:
  /api/v1/auth/config:
    get:
      security: []
      responses:
        '200':
          description: Public Firebase projectId and Web API key, never Admin credentials
        '503':
          description: Firebase is not configured
  /api/v1/ai/status:
    get:
      responses:
        '200':
          description: JSON configured boolean
  /api/v1/ai/quizzes:
    post:
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyInput'
      responses:
        '200':
          description: Quiz with id, title, source=ai and questions; each question has id,text,options,correctIndex,explanation,sourceExcerpt
        '401':
          description: Invalid/deleted/disabled/unverified account or token
        '409':
          description: This user/request ID already reserved generation
        '429':
          description: User, IP or global quota exhausted
  /api/v1/ai/flashcards:
    post:
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyInput'
      responses:
        '200':
          description: JSON cards array of front/back pairs, exactly count items
  /api/v1/ai/review:
    post:
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [material]
              properties:
                material: {type: string, minLength: 1, maxLength: 12000}
      responses:
        '200':
          description: JSON summary and nextSteps (1–8 strings)
  /api/v1/ai/extract:
    post:
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mimeType, data]
              properties:
                mimeType: {enum: [application/pdf, image/jpeg, image/png]}
                data: {type: string, contentEncoding: base64, maxLength: 4194304}
      responses:
        '200':
          description: JSON text, nonempty and at most 12000 characters; user must review OCR
  /api/v1/account:
    delete:
      responses:
        '200':
          description: Firebase account deleted and UID-specific quota records removed; recent authentication required, email verification optional
        '401':
          description: Authenticate again within five minutes before deleting the account
  /delete-account:
    get:
      security: []
      responses:
        '200':
          description: Same-origin account deletion form; requires recent Firebase password authentication
components:
  securitySchemes:
    firebase: {type: http, scheme: bearer, bearerFormat: Firebase ID token}
  parameters:
    RequestId:
      in: header
      name: X-Request-ID
      required: true
      schema: {type: string, format: uuid}
      description: New UUID per explicit generation. Do not automatically retry billable generation.
  schemas:
    StudyInput:
      type: object
      additionalProperties: false
      properties:
        topic: {type: string, maxLength: 160}
        material: {type: string, maxLength: 12000}
        difficulty: {enum: [easy, medium, hard], default: medium}
        count: {type: integer, minimum: 1, maximum: 25, default: 5}
      description: At least one of topic or material must be nonempty after trimming.
