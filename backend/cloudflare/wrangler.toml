name = "testhelper-ai"
main = "worker.mjs"
compatibility_date = "2026-11-20"
workers_dev = true
preview_urls = false
keep_vars = true

# Set only after enabling Email/Password in the owner's Firebase project.
# FIREBASE_PROJECT_ID and FIREBASE_WEB_API_KEY are public client configuration.
# Keep existing GEMINI_API_KEY and TESTHELPER_ACCESS_TOKEN secrets untouched.
# SQLite provisioning approved by the owner; retain this migration and class on rollback.
[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AiQuota"

[[migrations]]
tag = "auth-quota-v1"
new_sqlite_classes = ["AiQuota"]
